<!doctype html>
<!-- * Marco de Rebootera UI: intro, fondo animado, menú lateral, barra superior y área principal. -->
<html lang="en" data-theme="amoled">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rebootera OS</title>
    <meta
      name="description"
      content="Rebootera OS: install, recover and manage operating systems from one USB."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles/app.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <!-- * Logotipo: se define una vez y se usa en el menú y en la intro. Sus colores salen del tema
         (variables --logo-*), así que cambia con él. -->
    <svg class="sprite" width="0" height="0" aria-hidden="true">
      <defs>
        <linearGradient id="lg-tile" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" class="lg-t1" />
          <stop offset="1" class="lg-t2" />
        </linearGradient>
        <radialGradient id="lg-glow" cx="128" cy="170" r="120" gradientUnits="userSpaceOnUse">
          <stop offset="0" class="lg-g1" />
          <stop offset="1" class="lg-g2" />
        </radialGradient>
        <linearGradient id="lg-sun" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" class="lg-s1" />
          <stop offset="1" class="lg-s2" />
        </linearGradient>
        <clipPath id="lg-clip"><rect x="8" y="8" width="240" height="240" rx="58" /></clipPath>
        <clipPath id="lg-above"><rect x="0" y="0" width="256" height="168" /></clipPath>
      </defs>
      <symbol id="rbt-logo" viewBox="0 0 256 256">
        <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#lg-tile)" />
        <rect x="8" y="8" width="240" height="240" fill="url(#lg-glow)" clip-path="url(#lg-clip)" />
        <rect
          x="9.5"
          y="9.5"
          width="237"
          height="237"
          rx="56.5"
          fill="none"
          class="lg-edge"
          stroke-width="3"
        />
        <path
          d="M60.8 121A82 82 0 0 1 195.2 121"
          fill="none"
          class="lg-ray"
          stroke-opacity="0.9"
          stroke-linecap="round"
          stroke-width="8"
        />
        <path
          d="M37.9 116A104 104 0 0 1 218.1 116"
          fill="none"
          class="lg-ray"
          stroke-opacity="0.45"
          stroke-linecap="round"
          stroke-width="6"
        />
        <path d="M72 168A56 56 0 0 1 184 168Z" fill="url(#lg-sun)" />
        <path
          d="M56 182H200"
          fill="none"
          class="lg-ray"
          stroke-opacity="0.85"
          stroke-linecap="round"
          stroke-width="8"
        />
        <path
          d="M86 200H170"
          fill="none"
          class="lg-ray"
          stroke-opacity="0.4"
          stroke-linecap="round"
          stroke-width="8"
        />
      </symbol>
    </svg>

    <!-- * Intro ligera: se elimina del documento al terminar (intro.ts). -->
    <div id="intro" class="intro" aria-hidden="true">
      <div class="intro-center">
        <svg class="intro-logo" viewBox="0 0 256 256">
          <g class="intro-tile">
            <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#lg-tile)" />
            <rect
              x="8"
              y="8"
              width="240"
              height="240"
              fill="url(#lg-glow)"
              clip-path="url(#lg-clip)"
            />
            <rect
              x="9.5"
              y="9.5"
              width="237"
              height="237"
              rx="56.5"
              fill="none"
              class="lg-edge"
              stroke-width="3"
            />
          </g>
          <path
            class="intro-arc intro-arc-b lg-ray"
            pathLength="100"
            d="M37.9 116A104 104 0 0 1 218.1 116"
            fill="none"
            stroke-opacity="0.45"
            stroke-linecap="round"
            stroke-width="6"
          />
          <path
            class="intro-arc intro-arc-a lg-ray"
            pathLength="100"
            d="M60.8 121A82 82 0 0 1 195.2 121"
            fill="none"
            stroke-opacity="0.9"
            stroke-linecap="round"
            stroke-width="8"
          />
          <g clip-path="url(#lg-above)">
            <path class="intro-sun" d="M72 168A56 56 0 0 1 184 168Z" fill="url(#lg-sun)" />
          </g>
          <path
            class="intro-line intro-line-a lg-ray"
            d="M56 182H200"
            fill="none"
            stroke-opacity="0.85"
            stroke-linecap="round"
            stroke-width="8"
          />
          <path
            class="intro-line intro-line-b lg-ray"
            d="M86 200H170"
            fill="none"
            stroke-opacity="0.4"
            stroke-linecap="round"
            stroke-width="8"
          />
        </svg>
        <h1 class="intro-wordmark"></h1>
        <p class="intro-tagline" data-i18n="intro.tagline"></p>
      </div>
    </div>

    <!-- * Fondo animado: dos órbitas de anillos que giran despacio en sentidos opuestos y dos haces de luz que
         cruzan la pantalla. Solo giran y desplazan capas (transform), así que cuesta muy poco; se apaga solo en
         equipos modestos (ver prefs.ts) o desde Ajustes. El grano y la luz de fondo son estáticos. -->
    <div class="bg" aria-hidden="true">
      <span class="bg-glow"></span>
      <svg class="orbit orbit-a" viewBox="0 0 400 400">
        <circle cx="200" cy="200" r="196" />
        <circle cx="200" cy="200" r="150" class="dashed" />
        <circle cx="200" cy="200" r="104" />
        <circle cx="200" cy="4" r="4" class="dot" />
        <circle cx="38" cy="296" r="3" class="dot" />
      </svg>
      <svg class="orbit orbit-b" viewBox="0 0 400 400">
        <circle cx="200" cy="200" r="190" class="dashed" />
        <circle cx="200" cy="200" r="132" />
        <circle cx="396" cy="200" r="4" class="dot" />
        <circle cx="130" cy="330" r="3" class="dot" />
      </svg>
      <span class="beam beam-a"></span>
      <span class="beam beam-b"></span>
      <span class="bg-grain"></span>
    </div>

    <div class="app">
      <header class="topnav">
        <div class="brand">
          <svg class="brand-logo" width="34" height="34"><use href="#rbt-logo" /></svg>
          <div class="brand-text">
            <span class="brand-name">Rebootera <span class="accent">OS</span></span>
            <span class="brand-version" id="version"></span>
          </div>
        </div>
        <nav id="nav" class="tabs" data-i18n-label="nav.section"></nav>
        <div class="topnav-right">
          <span id="status-chip"></span>
          <div class="drive-chip" id="drive-card"></div>
          <button
            class="icon-button icon-button-danger"
            id="power-button"
            type="button"
            data-i18n-label="topbar.power"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" id="power-icon"></svg>
          </button>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>

    <div class="overlay" id="overlay" hidden>
      <svg width="96" height="96"><use href="#rbt-logo" /></svg>
      <p id="overlay-text"></p>
    </div>
  </body>
</html>
