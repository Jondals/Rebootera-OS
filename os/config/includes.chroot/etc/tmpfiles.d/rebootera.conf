# * Carpeta de Rebootera en /run: aquí se montan el Vault y los medios externos.
d /run/rebootera 0755 root root -
# * Descargas del navegador: las escribe la sesión gráfica (usuario rebootera, del grupo rebootera-ui) y las pasa al USB
# * Rebootera Core (grupo rebootera-ui). Nada de lo que hay aquí se ejecuta.
d /run/rebootera/downloads 2770 root rebootera-ui -
