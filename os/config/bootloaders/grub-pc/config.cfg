# * Configuración común del menú de GRUB de Rebootera OS: arranque directo (menú oculto), modo gráfico,
# * fuentes del tema y tiempo de espera.
set default=0
# * Arranca del tirón: sin menú ni espera. Para ver el menú (por ejemplo, para elegir "safe graphics") hay que
# * mantener pulsada la tecla Mayús al encender (en BIOS) o pulsar Esc enseguida.
set timeout=0
set timeout_style=hidden
if keystatus --shift ; then
    set timeout=-1
    set timeout_style=menu
fi

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

if loadfont $font ; then
    set gfxmode=1024x768,800x600,auto
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

# * Fuentes del tema (Inter); si faltan se usa unicode.pf2.
# ! Rutas absolutas: cuando Ventoy arranca la ISO, $prefix no apunta a
# ! /boot/grub y las fuentes no se encontrarían.
for font_file in inter-18 inter-bold-18 inter-13; do
    if [ -e /boot/grub/live-theme/$font_file.pf2 ]; then
        loadfont /boot/grub/live-theme/$font_file.pf2
    fi
done

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm
