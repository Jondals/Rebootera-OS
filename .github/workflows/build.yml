# Compila Rebootera OS (ISO) y Rebootera Desktop (.exe) en cada push y los
# publica en una release, de donde los descarga la landing page y Rebootera
# Desktop ("Crear USB" y "Actualizar"). Las releases se publican en este mismo repositorio
# con el token que da GitHub a cada ejecución (no hace falta ningún secreto).
# Hay dos canales:
#
#   master -> release "latest" (estable), con el nombre que tú elijas (ver abajo). Al publicarla, si la rama "beta" no
#             existe se crea desde este commit; si existe y no tiene commits
#             propios se avanza hasta aquí; y la release "beta" se publica con
#             los mismos archivos.
#   beta   -> release "beta" (prerelease), donde se prueban los cambios antes de
#             pasarlos a master. Nunca toca "latest".
#
# Nombre de la release de master: al fusionar beta en master (o cualquier push), el título sale de
#   1. una línea "Release: <nombre>" en el mensaje del commit (o del merge), si la hay;
#   2. si no, del título de la pull request cuando es un merge de GitHub ("Merge pull request #N ...");
#   3. si no, "Rebootera OS <versión> (latest build)".
# El nombre queda como título de la release y la primera línea de sus notas.
#
# La compilación se hace dentro de un contenedor Debian 13, igual que el entorno
# de desarrollo (WSL "RebooteraBuild"), con las dependencias del README.
name: Build and publish

on:
  push:
    branches: [master, beta]
    paths-ignore:
      - "site/**"
      - "docs/images/**"
  workflow_dispatch:

permissions:
  contents: write

# * Un push nuevo cancela la compilación anterior: "latest" siempre es la última.
concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build the ISO and the desktop apps (Debian 13)
        run: |
          docker run --rm --privileged -v "$PWD":/src -w /src debian:trixie bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y live-build debootstrap rsync curl git ca-certificates golang nodejs node-corepack \
              imagemagick librsvg2-bin grub-common fonts-inter fonts-jetbrains-mono xorriso mtools squashfs-tools \
              dosfstools exfatprogs
            git config --global --add safe.directory /src
            bash scripts/build/build-desktop.sh --all
            bash scripts/build/build.sh
          '

      - name: Collect the files with their fixed names
        run: |
          sudo chown -R "$USER" out
          VERSION="$(sed -n 's/^var Version = "\(.*\)"/\1/p' core/internal/version/version.go)"
          mkdir -p dist
          cp "out/rebootera-os-${VERSION}-amd64.iso" dist/rebootera-os-amd64.iso
          cp "out/Rebootera-Desktop-${VERSION}.exe" dist/Rebootera-Desktop.exe
          (cd dist && sha256sum rebootera-os-amd64.iso > rebootera-os-amd64.iso.sha256)
          (cd dist && sha256sum Rebootera-Desktop.exe > Rebootera-Desktop.exe.sha256)
          for archive in dist/rebootera-desktop-*.tar.gz; do
            (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          done
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ISO_SHA=$(cut -d' ' -f1 dist/rebootera-os-amd64.iso.sha256)" >> "$GITHUB_ENV"
          ls -lh dist

      - name: Publish the release of this channel
        env:
          GH_TOKEN: ${{ github.token }}
          REL_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          TARGET=()
          [ "$REL_REPO" = "$GITHUB_REPOSITORY" ] && TARGET=(--target "$GITHUB_SHA")
          if [ "$BRANCH" = "master" ]; then
            TAG=latest
            FLAGS=--latest
            TITLE="Rebootera OS ${VERSION} (latest build)"
            # * Nombre elegido: línea "Release: ..." del commit o, en un merge de pull request, el título de la PR.
            MESSAGE="$(git log -1 --format=%B "$GITHUB_SHA")"
            CHOSEN="$(echo "$MESSAGE" | sed -n 's/^[Rr]elease:[[:space:]]*//p' | head -n 1)"
            if [ -z "$CHOSEN" ] && echo "$MESSAGE" | head -n 1 | grep -q '^Merge pull request'; then
              CHOSEN="$(echo "$MESSAGE" | sed -n '3p')"
            fi
            [ -n "$CHOSEN" ] && TITLE="$CHOSEN"
            WHAT="Automatic build of the last push to master (stable)."
          else
            TAG=beta
            FLAGS=--prerelease
            TITLE="Rebootera OS ${VERSION} (beta build)"
            WHAT="Automatic build of the last push to the beta branch. Use it to try changes before they reach master."
          fi
          gh release delete "$TAG" -R "$REL_REPO" --cleanup-tag --yes || true
          gh release create "$TAG" dist/* -R "$REL_REPO" \
            "${TARGET[@]}" \
            $FLAGS \
            --title "$TITLE" \
            --notes "$WHAT

          version: ${VERSION}
          commit: ${GITHUB_SHA}
          sha256: ${ISO_SHA}

          Files: \`Rebootera-Desktop.exe\` (Windows app that creates the USB), \`rebootera-desktop-linux-*.tar.gz\` and \`rebootera-desktop-darwin-*.tar.gz\` (the desktop app for Linux and macOS) and \`rebootera-os-amd64.iso\` (the Rebootera OS image)."

      - name: Create or advance the beta branch and publish the beta release
        if: github.ref_name == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
          REL_REPO: ${{ github.repository }}
        run: |
          TARGET=()
          [ "$REL_REPO" = "$GITHUB_REPOSITORY" ] && TARGET=(--target "$GITHUB_SHA")
          git fetch origin beta 2>/dev/null || true
          if ! git rev-parse --verify --quiet origin/beta >/dev/null; then
            echo "The beta branch does not exist: creating it from $GITHUB_SHA"
          elif git merge-base --is-ancestor origin/beta "$GITHUB_SHA"; then
            echo "beta has no commits of its own: moving it to $GITHUB_SHA"
          else
            echo "beta has commits that are not in master: left untouched (merge master into beta by hand)."
            exit 0
          fi
          # * Con GITHUB_TOKEN este push no lanza otra compilación: la release "beta" se publica aquí mismo.
          git push origin "$GITHUB_SHA:refs/heads/beta"
          gh release delete beta -R "$REL_REPO" --cleanup-tag --yes || true
          gh release create beta dist/* -R "$REL_REPO" \
            "${TARGET[@]}" \
            --prerelease \
            --title "Rebootera OS ${VERSION} (beta build)" \
            --notes "Same build as the latest release, published when the beta branch was created or moved to it.

          version: ${VERSION}
          commit: ${GITHUB_SHA}
          sha256: ${ISO_SHA}"
