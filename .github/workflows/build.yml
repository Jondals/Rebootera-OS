# Compila Rebootera OS (ISO) y Rebootera Desktop (.exe) en cada push y los
# publica en una release, de donde los descarga la landing page y Rebootera
# Desktop ("Crear USB" y "Actualizar"). Las releases se publican en este mismo repositorio
# con el token que da GitHub a cada ejecución (no hace falta ningún secreto).
# Solo se publica al llegar código a master (por ejemplo, al fusionar la PR beta -> master):
# cada vez se crea una release nueva con la etiqueta "v<versión>" y se marca como la última.
# Las anteriores se conservan. Un push a beta no compila ni publica nada (lo prueba test.yml).
# Si se vuelve a publicar la misma versión, se reemplaza solo la release de esa versión.
#
# Nombre de la release: al fusionar beta en master (o cualquier push a master), el título sale de
#   1. una línea "Release: <nombre>" en el mensaje del commit (o del merge), si la hay;
#   2. si no, del título de la pull request cuando es un merge de GitHub ("Merge pull request #N ...");
#   3. si no, la primera línea del mensaje del commit (así basta con escribir un buen mensaje al hacer push).
# El nombre queda como título de la release y la primera línea de sus notas.
#
# La compilación se hace dentro de un contenedor Debian 13, igual que el entorno
# de desarrollo (WSL "RebooteraBuild"), con las dependencias del README.
name: Build and publish

on:
  push:
    branches: [master]
    paths-ignore:
      - "site/**"
      - "docs/images/**"
  workflow_dispatch:

permissions:
  contents: write

# * Un push nuevo cancela la compilación anterior: la release más reciente siempre es la última.
concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build the ISO and the desktop apps (Debian 13)
        run: |
          docker run --rm --privileged -v "$PWD":/src -w /src debian:trixie bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y live-build debootstrap rsync curl git ca-certificates golang nodejs node-corepack python3 \
              imagemagick librsvg2-bin grub-common fonts-inter fonts-jetbrains-mono xorriso mtools squashfs-tools \
              dosfstools exfatprogs
            git config --global --add safe.directory /src
            bash scripts/build/build-desktop.sh --all
            bash scripts/build/build.sh
          '

      - name: Collect the files with their fixed names
        run: |
          sudo mkdir -p dist
          sudo chown -R "$USER" out dist
          VERSION="$(sed -n 's/^var Version = "\(.*\)"/\1/p' core/internal/version/version.go)"
          mkdir -p dist
          cp "out/rebootera-os-${VERSION}-amd64.iso" dist/rebootera-os-amd64.iso
          cp "out/Rebootera-Desktop-${VERSION}.exe" dist/Rebootera-Desktop-Windows.exe
          (cd dist && sha256sum rebootera-os-amd64.iso > rebootera-os-amd64.iso.sha256)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ISO_SHA=$(cut -d' ' -f1 dist/rebootera-os-amd64.iso.sha256)" >> "$GITHUB_ENV"
          ls -lh dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REL_REPO: ${{ github.repository }}
        run: |
          TARGET=()
          [ "$REL_REPO" = "$GITHUB_REPOSITORY" ] && TARGET=(--target "$GITHUB_SHA")
          TAG="v${VERSION}"
          TITLE="Rebootera OS ${VERSION}"
          # * Nombre elegido: línea "Release: ..." del commit o, en un merge de pull request, el título de la PR.
          MESSAGE="$(git log -1 --format=%B "$GITHUB_SHA")"
          CHOSEN="$(echo "$MESSAGE" | sed -n 's/^[Rr]elease:[[:space:]]*//p' | head -n 1)"
          if [ -z "$CHOSEN" ] && echo "$MESSAGE" | head -n 1 | grep -q '^Merge pull request'; then
            CHOSEN="$(echo "$MESSAGE" | sed -n '3p')"
          fi
          [ -z "$CHOSEN" ] && CHOSEN="$(echo "$MESSAGE" | head -n 1)"
          [ -n "$CHOSEN" ] && TITLE="$CHOSEN"
          WHAT="Automatic build of master."
          # * Solo se reemplaza la release de esta misma versión; las demás se conservan.
          gh release delete "$TAG" -R "$REL_REPO" --cleanup-tag --yes || true
          gh release create "$TAG" dist/* -R "$REL_REPO" \
            "${TARGET[@]}" \
            --latest \
            --title "$TITLE" \
            --notes "$WHAT

          version: ${VERSION}
          commit: ${GITHUB_SHA}
          sha256: ${ISO_SHA}

          Files: \`Rebootera-Desktop-Windows.exe\`, \`Rebootera-Desktop-macOS-*\` and \`Rebootera-Desktop-Linux-*\` (the desktop app that creates the USB, one per system; the macOS and Linux ones are plain executables) and \`rebootera-os-amd64.iso\` (the Rebootera OS image)."
