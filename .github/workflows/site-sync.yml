# Copia la web (site/, capturas y logo) al repositorio público de descargas, cuyo
# propio workflow la publica en GitHub Pages. Usa el mismo secreto RELEASES_TOKEN que
# build.yml; sin él no hace nada.
name: Sync the website

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "docs/images/**"
      - "branding/**"
      - ".github/workflows/site-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - name: Check the secret
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::warning::RELEASES_TOKEN is not set: the public website is not updated."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Copy the website to the public repository
        run: |
          git clone --depth 1 "https://x-access-token:${RELEASES_TOKEN}@github.com/Jondals/Rebootera-OS-downloads.git" public
          rm -rf public/site
          mkdir -p public/site/images
          cp site/index.html public/site/index.html
          cp branding/logo.svg public/site/logo.svg
          cp docs/images/*.png public/site/images/
          cd public
          git config user.name "rebootera-bot"
          git config user.email "rebootera-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The website is already up to date."
          else
            git commit -m "Website from ${GITHUB_SHA::7}"
            git push origin HEAD:main
          fi
