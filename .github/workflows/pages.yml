# Publica la landing page (site/) en GitHub Pages. Los datos de versión y los
# enlaces de descarga los lee la propia página de la release "latest", así que
# no hace falta volver a desplegarla cuando cambia una compilación.
#
# Ajuste único en GitHub: Settings > Pages > Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "docs/images/**"
      - "branding/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add the screenshots and the logo to the site
        run: |
          mkdir -p site/images
          cp docs/images/*.png site/images/
          cp branding/logo.svg site/logo.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
